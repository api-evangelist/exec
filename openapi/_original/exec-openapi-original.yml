components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: |
        API key created in Settings > API.

        Format: `exec_live_` followed by 40 alphanumeric characters.
  schemas:
    Workspace:
      type: object
      properties:
        id:
          type: string
          description: Unique workspace identifier
        name:
          type: string
          description: Workspace display name
        url_slug:
          type: string
          description: URL-friendly workspace identifier
        created_at:
          type: string
          format: date-time
          description: When the workspace was created
    WorkspaceMember:
      type: object
      description: >-
        A workspace member. The id is the user's unique identifier, consistent
        with user objects across all endpoints.
      properties:
        id:
          type: string
          description: >-
            Unique user identifier (same as user.id in sessions, assignments,
            etc.)
        email:
          type: string
          format: email
          description: Member's email address
        first_name:
          type: string
          description: Member's first name
        last_name:
          type: string
          description: Member's last name
        role:
          type: string
          description: Member's role in the workspace
          enum:
            - admin
            - staff
            - member
        created_at:
          type: string
          format: date-time
          description: When the member was added
    User:
      type: object
      properties:
        id:
          type: string
          description: Unique user identifier
        email:
          type: string
          format: email
          description: User's email address
        first_name:
          type: string
          description: User's first name
        last_name:
          type: string
          description: User's last name
    WorkspaceGroup:
      type: object
      properties:
        id:
          type: string
          description: Unique group identifier
        name:
          type: string
          description: Group name
        created_at:
          type: string
          format: date-time
          description: When the group was created
    Collection:
      type: object
      description: A collection that groups related scenarios together.
      properties:
        id:
          type: string
          description: Unique collection identifier
        name:
          type: string
          description: Collection name
        slug:
          type: string
          description: URL-friendly collection identifier
        description:
          type: string
          nullable: true
          description: Collection description
        scenario_count:
          type: integer
          description: Number of scenarios in this collection
        created_at:
          type: string
          format: date-time
          description: When the collection was created
    Assignment:
      type: object
      description: A scenario assignment given to a user as a practice task.
      properties:
        id:
          type: string
          description: Unique assignment identifier
        user:
          $ref: '#/components/schemas/User'
        scenario:
          $ref: '#/components/schemas/ScenarioRef'
        status:
          type: string
          enum:
            - not_started
            - in_progress
            - completed
            - past_due
            - did_not_pass
          description: Current assignment status
        due_date:
          type: string
          format: date-time
          nullable: true
          description: When the assignment is due
        best_score:
          type: number
          nullable: true
          description: Highest score achieved on this assignment
        best_rank:
          type: string
          nullable: true
          enum:
            - gold
            - silver
            - bronze
            - unranked
          description: Rank from the best scoring attempt
        attempt_count:
          type: integer
          description: Number of completed attempts
        attempt_min:
          type: integer
          nullable: true
          description: Minimum attempts required
        attempt_max:
          type: integer
          nullable: true
          description: Maximum attempts allowed
        rank_min:
          type: string
          nullable: true
          enum:
            - gold
            - silver
            - bronze
            - unranked
          description: Minimum rank required to pass
        program:
          type: object
          nullable: true
          description: Program this assignment belongs to (null if standalone)
          properties:
            id:
              type: string
            name:
              type: string
        created_at:
          type: string
          format: date-time
    SessionListItem:
      type: object
      description: A roleplay session summary for list responses.
      properties:
        id:
          type: string
          description: Unique session identifier
        user:
          $ref: '#/components/schemas/User'
          description: The user who participated in this session
        scenario:
          $ref: '#/components/schemas/ScenarioRef'
          description: The scenario that was practiced
        score:
          type: number
          nullable: true
          description: Session score (0-100 scale)
        rank:
          type: string
          nullable: true
          enum:
            - gold
            - silver
            - bronze
            - unranked
          description: Performance rank based on score
        duration_seconds:
          type: number
          nullable: true
          description: Session duration in seconds
        is_valid_attempt:
          type: boolean
          description: >-
            Whether this session counts as a valid graded attempt. A session is
            valid when it was completed (not abandoned), received AI grading,
            and has a score. Use valid attempts for analytics; non-valid
            sessions may be incomplete or ungraded.
        created_at:
          type: string
          format: date-time
          description: When the session was created
    SessionDetail:
      type: object
      description: Full roleplay session detail with optional transcript and evaluations.
      properties:
        id:
          type: string
          description: Unique session identifier
        user:
          $ref: '#/components/schemas/User'
        scenario:
          $ref: '#/components/schemas/ScenarioRef'
        score:
          type: number
          nullable: true
          description: Session score (0-100 scale)
        rank:
          type: string
          nullable: true
          enum:
            - gold
            - silver
            - bronze
            - unranked
          description: Performance rank based on score
        duration_seconds:
          type: number
          nullable: true
          description: Session duration in seconds
        is_valid_attempt:
          type: boolean
          description: >-
            Whether this session counts as a valid graded attempt. A session is
            valid when it was completed (not abandoned), received AI grading,
            and has a score. Use valid attempts for analytics; non-valid
            sessions may be incomplete or ungraded.
        outcome_feedback:
          type: string
          nullable: true
          description: Overall outcome summary from the AI evaluator
        positive_feedback:
          type: string
          nullable: true
          description: What the participant did well
        constructive_feedback:
          type: string
          nullable: true
          description: Areas for improvement
        transcript:
          type: array
          nullable: true
          description: >-
            Conversation transcript lines, excluding system messages (only
            included when requested via `?include=transcript`)
          items:
            $ref: '#/components/schemas/TranscriptLine'
        evaluations:
          type: array
          nullable: true
          description: >-
            Evaluation criteria with grades (only included when requested via
            `?include=evaluations`)
          items:
            $ref: '#/components/schemas/EvaluationCriterion'
        created_at:
          type: string
          format: date-time
          description: When the session was created
    TranscriptLine:
      type: object
      description: A single line in the session transcript.
      properties:
        speaker:
          type: string
          nullable: true
          description: >-
            Speaker identifier (e.g. "ai" for the AI character, "user" for the
            participant)
        text:
          type: string
          description: The spoken text
        seconds_from_start:
          type: number
          nullable: true
          description: Seconds elapsed from the start of the session
    EvaluationCriterion:
      type: object
      description: A rubric criterion with its evaluated items and feedback examples.
      properties:
        criterion_name:
          type: string
          description: Name of the parent evaluation criterion
        items:
          type: array
          description: Evaluated items under this criterion
          items:
            $ref: '#/components/schemas/EvaluationItem'
    EvaluationItem:
      type: object
      description: An individual evaluation item with grade, feedback, and evidence.
      properties:
        name:
          type: string
          description: Name of the evaluation item
        grade:
          type: string
          nullable: true
          enum:
            - good
            - mid
            - bad
            - not_relevant
          description: Grade received on this item
        feedback:
          type: string
          nullable: true
          description: Detailed feedback for this item
        feedback_examples:
          type: array
          description: >-
            Specific transcript evidence supporting the evaluation (filtered to
            High/Mid salience)
          items:
            $ref: '#/components/schemas/FeedbackExample'
    FeedbackExample:
      type: object
      description: >-
        A specific piece of evidence from the transcript supporting an
        evaluation.
      properties:
        quote:
          type: string
          description: Transcript excerpt
        feedback:
          type: string
          nullable: true
          description: Explanation of what was good or could be improved
        suggestion_quote:
          type: string
          nullable: true
          description: Suggested alternative phrasing
        grade:
          type: string
          nullable: true
          enum:
            - good
            - mid
            - bad
            - not_relevant
          description: Grade for this specific moment
        salience:
          type: string
          nullable: true
          enum:
            - high
            - mid
            - low
          description: Importance level of this feedback
    ScenarioRef:
      type: object
      description: A compact scenario reference for embedding in other responses.
      properties:
        id:
          type: string
          description: Unique scenario identifier
        name:
          type: string
          description: Scenario name
        slug:
          type: string
          description: URL-friendly scenario identifier
    ScenarioAnalyticsSummary:
      type: object
      description: Aggregate analytics metrics for a scenario.
      properties:
        participant_count:
          type: integer
          description: Number of unique participants with graded sessions
        total_sessions:
          type: integer
          description: Total number of graded sessions
        average_best_score:
          type: number
          description: Average of each participant's best score (0-100)
        average_best_rank:
          type: string
          enum:
            - gold
            - silver
            - bronze
            - unranked
          description: Rank corresponding to the average best score
        average_lift_percentage:
          type: number
          description: Average improvement (best - first score) across participants
        total_practice_minutes:
          type: integer
          description: Total practice time across all sessions in minutes
        average_session_duration_seconds:
          type: number
          description: Average duration per session in seconds
        score_distribution:
          $ref: '#/components/schemas/ScenarioScoreDistribution'
    ScenarioParticipantEntry:
      type: object
      description: Per-user performance data for a scenario.
      properties:
        user:
          $ref: '#/components/schemas/User'
        session_count:
          type: integer
          description: Number of sessions the user completed
        first_score:
          type: number
          nullable: true
          description: Score from the user's first attempt
        first_rank:
          type: string
          nullable: true
          enum:
            - gold
            - silver
            - bronze
            - unranked
          description: Rank from the first attempt
        best_score:
          type: number
          nullable: true
          description: User's highest score
        best_rank:
          type: string
          nullable: true
          enum:
            - gold
            - silver
            - bronze
            - unranked
          description: Rank from the best score
        lift_percentage:
          type: number
          nullable: true
          description: Improvement from first to best score
        total_duration_seconds:
          type: number
          description: Total practice time in seconds
    ScenarioScoreDistribution:
      type: array
      description: >-
        Rank distribution across participants based on best scores (Gold ≥90,
        Silver ≥75, Bronze ≥50, Unranked <50).
      items:
        type: object
        properties:
          rank:
            type: string
            enum:
              - gold
              - silver
              - bronze
              - unranked
            description: Performance rank
          count:
            type: integer
            description: Number of participants at this rank
          percentage:
            type: number
            description: Percentage of participants at this rank
    SkillProficiencyEntry:
      type: object
      description: Proficiency data for a single user on a skill.
      properties:
        user:
          $ref: '#/components/schemas/User'
        score:
          type: number
          nullable: true
          description: Proficiency score (0-100). Null if fewer than 3 observations.
        tier:
          type: string
          enum:
            - excellent
            - proficient
            - developing
            - needs_work
            - insufficient_data
          description: Proficiency tier based on score thresholds
        observation_count:
          type: integer
          description: >-
            Total observations (roleplay sessions + calls) within the lookback
            window
        last_practiced_at:
          type: string
          format: date-time
          nullable: true
          description: When the most recent observation occurred
    Skill:
      type: object
      description: A competency that is evaluated during roleplay sessions and calls.
      properties:
        id:
          type: string
          description: Unique skill identifier
        name:
          type: string
          description: Skill name
        slug:
          type: string
          description: URL-friendly skill identifier
        description:
          type: string
          description: Description of the skill
        created_at:
          type: string
          format: date-time
          description: When the skill was created
        proficiency_summary:
          $ref: '#/components/schemas/SkillProficiencySummary'
          nullable: true
          description: >-
            Aggregate proficiency stats (only included when requested via
            `?include=proficiency`)
    SkillProficiencySummary:
      type: object
      description: Aggregate proficiency stats for a skill across all workspace members.
      properties:
        participant_count:
          type: integer
          description: Number of users with at least one observation on this skill
        scored_participant_count:
          type: integer
          description: >-
            Number of users with enough observations (3+) for a proficiency
            score
        pct_proficient_plus:
          type: integer
          description: Percentage of scored users at Proficient or Excellent tier
        avg_score:
          type: number
          nullable: true
          description: Average proficiency score across scored users (0-100)
    SkillRef:
      type: object
      description: A compact skill reference for embedding in other responses.
      properties:
        id:
          type: string
          description: Unique skill identifier
        name:
          type: string
          description: Skill name
        slug:
          type: string
          description: URL-friendly skill identifier
    Scenario:
      type: object
      properties:
        id:
          type: string
          description: Unique scenario identifier
        name:
          type: string
          description: Scenario name
        description:
          type: string
          nullable: true
          description: Short description of the scenario
        slug:
          type: string
          description: URL-friendly scenario identifier
        url:
          type: string
          format: uri
          description: Direct link to the scenario
        difficulty:
          type: string
          description: Scenario difficulty level
          enum:
            - easy
            - medium
            - hard
            - very_hard
            - custom
        context:
          type: string
          nullable: true
          description: >
            The scenario's context - background and setup information that
            frames

            the roleplay (e.g., the buyer's company, current situation, recent

            events). Plain text, may contain newlines. May be null for scenarios

            that haven't filled in this section.
          example: >-
            The buyer is the VP of Engineering at a Series B fintech. They have
            an active RFP out for an observability tool and your competitor
            presented yesterday.
        objective:
          type: string
          nullable: true
          description: |
            The learner's objective for the scenario. The value is markdown and
            includes an embedded "Outcomes to Avoid" subsection separated by the
            delimiter `##### Outcomes to Avoid:`, followed by a bulleted list.
            Consumers who want the two pieces separately can split on that
            delimiter.
          example: >
            Qualify the opportunity and book a follow-up meeting with the
            economic buyer.

            ##### Outcomes to Avoid:

            - Discounting before discovery

            - Skipping the budget conversation

            - Committing to a custom integration without scoping
        language:
          type: string
          description: Scenario language
        visibility:
          type: string
          description: Sharing scope of the scenario
          enum:
            - private
            - workspace
        owner:
          $ref: '#/components/schemas/User'
          nullable: true
          description: User who owns the scenario
        created_at:
          type: string
          format: date-time
          description: When the scenario was created
        updated_at:
          type: string
          format: date-time
          description: When the scenario was last updated
        skills:
          type: array
          nullable: true
          description: >-
            Skills evaluated by this scenario (only included when requested via
            `?include=skills`)
          items:
            $ref: '#/components/schemas/SkillRef'
    ScenarioStudioSession:
      type: object
      properties:
        id:
          type: string
          description: Session identifier
        url:
          type: string
          format: uri
          description: URL for the user to complete scenario creation
        is_new:
          type: boolean
          description: >-
            True if a new session was created, false if an existing session was
            returned via request_id
    ScenarioJob:
      type: object
      properties:
        id:
          type: string
          description: Job identifier
        status:
          type: string
          enum:
            - queued
            - processing
            - completed
            - failed
            - cancelled
          description: Current job status
        scenario:
          type: object
          nullable: true
          description: Created scenario details (only present when status is "completed")
          properties:
            id:
              type: string
              description: Scenario ID
            name:
              type: string
              description: Scenario name
            url:
              type: string
              format: uri
              description: Direct link to the scenario
        error:
          type: object
          nullable: true
          description: Error details (only present when status is "failed")
          properties:
            code:
              type: string
              description: Error code (e.g. GENERATION_ERROR, CONTENT_POLICY_VIOLATION)
            message:
              type: string
              description: Human-readable error message
        created_at:
          type: string
          format: date-time
          description: When the job was created
        started_at:
          type: string
          format: date-time
          nullable: true
          description: When the job started processing
        completed_at:
          type: string
          format: date-time
          nullable: true
          description: When the job finished (success, failure, or cancelled)
        duration_seconds:
          type: number
          nullable: true
          description: Processing duration in seconds (only present when job has completed)
    ScenarioAccessResponse:
      type: object
      properties:
        user_email:
          type: string
          format: email
          description: Email of the user checked
        scenario_id:
          type: string
          description: Scenario identifier
        permissions:
          type: object
          properties:
            can_view:
              type: boolean
              description: Whether the user can view the scenario
            can_share:
              type: boolean
              description: Whether the user can share the scenario
            can_monitor:
              type: boolean
              description: Whether the user can monitor sessions on this scenario
            can_edit:
              type: boolean
              description: Whether the user can edit the scenario
    GrantAccessResponse:
      type: object
      properties:
        user_email:
          type: string
          format: email
          description: Email of the user granted access
        scenario_id:
          type: string
          description: Scenario identifier
        permission_level:
          type: string
          enum:
            - view
            - share
            - monitor
            - edit
          description: Permission level granted
        granted:
          type: boolean
          description: Whether the access was successfully granted
    KnowledgeHubFolder:
      type: object
      description: >-
        A Knowledge Hub folder (also called a Space or Hub) that groups pages
        and sources.
      properties:
        id:
          type: string
          description: Unique folder identifier (UUID)
        name:
          type: string
          description: Folder name
        emoji:
          type: string
          nullable: true
          description: Emoji icon shown next to the folder
        parent:
          type: string
          nullable: true
          description: UUID of the parent folder, or null for a top-level folder
        visibility:
          type: string
          enum:
            - private
            - workspace
            - global
          description: Visibility scope of the folder
        item_count:
          type: integer
          description: Number of non-archived pages directly in this folder
        subfolder_count:
          type: integer
          description: Number of direct child folders
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    KnowledgeHubFolderRef:
      type: object
      description: A compact folder reference embedded in pages and sources.
      properties:
        id:
          type: string
          description: Unique folder identifier (UUID)
        name:
          type: string
          description: Folder name
        emoji:
          type: string
          nullable: true
          description: Emoji icon shown next to the folder
    KnowledgeHubSkillRef:
      type: object
      description: A compact skill reference embedded in pages.
      properties:
        id:
          type: string
          description: Unique skill identifier (UUID)
        name:
          type: string
          description: Skill name
    KnowledgeHubPage:
      type: object
      description: >-
        A Knowledge Hub page. List responses return this metadata-only shape (no
        body).
      properties:
        id:
          type: string
          description: Unique page identifier (UUID)
        title:
          type: string
          description: Page title
        status:
          type: string
          enum:
            - draft
            - published
            - archived
          description: Current page status
        visibility:
          type: string
          enum:
            - private
            - workspace
            - global
          description: Visibility scope of the page
        owner:
          $ref: '#/components/schemas/User'
          nullable: true
          description: User who owns the page
        folders:
          type: array
          description: Folders the page belongs to
          items:
            $ref: '#/components/schemas/KnowledgeHubFolderRef'
        skills:
          type: array
          description: Skills associated with the page
          items:
            $ref: '#/components/schemas/KnowledgeHubSkillRef'
        source_count:
          type: integer
          description: Number of sources attached to the page
        version:
          type: integer
          nullable: true
          description: Version number of the published version, or null if never published
        cover:
          type: string
          description: Cover image reference (empty string if none)
        published_at:
          type: string
          format: date-time
          nullable: true
          description: When the page was last published
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    KnowledgeHubPageDetail:
      description: >-
        A single page with its published body, attached sources, and
        (optionally) its draft.
      allOf:
        - $ref: '#/components/schemas/KnowledgeHubPage'
        - type: object
          properties:
            content:
              type: string
              nullable: true
              description: Markdown body of the published version (null if unpublished)
            sources:
              type: array
              description: Sources attached to the page
              items:
                $ref: '#/components/schemas/KnowledgeHubSource'
            draft:
              $ref: '#/components/schemas/KnowledgeHubPageDraft'
              nullable: true
              description: >-
                Current draft (only included when requested via
                `?include=draft`)
    KnowledgeHubPageDraft:
      type: object
      description: The unpublished draft of a page.
      properties:
        title:
          type: string
          description: Draft title
        content:
          type: string
          nullable: true
          description: Markdown body of the draft
    KnowledgeHubPageVersion:
      type: object
      description: A single entry in a page's version history.
      properties:
        version:
          type: integer
          description: Version number
        title:
          type: string
          description: Page title at this version
        change_type:
          type: string
          enum:
            - created
            - ai_generation
            - manual_edit
            - restore
            - clone
          description: What kind of change produced this version
        created_by:
          $ref: '#/components/schemas/User'
          nullable: true
          description: User who created this version (null for system/AI changes)
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    KnowledgeHubSource:
      type: object
      description: >-
        A Knowledge Hub source — an uploaded file or ingested URL whose text is
        extracted and indexed.
      properties:
        id:
          type: string
          description: Unique source identifier (UUID)
        title:
          type: string
          description: Source title
        source_type:
          type: string
          enum:
            - upload
            - url
            - notion
            - google_drive
            - guru
            - page
            - integration
          description: Where the source came from
        status:
          type: string
          enum:
            - pending
            - processing
            - ready
            - failed
          description: Text-extraction status
        content_format:
          type: string
          nullable: true
          enum:
            - markdown
            - plain_text
            - image
            - video
          description: Format of the extracted content
        token_count:
          type: integer
          nullable: true
          description: Number of tokens in the extracted text
        has_images:
          type: boolean
          description: Whether the source contains images
        external_url:
          type: string
          nullable: true
          description: >-
            Original URL for url/notion/guru/google_drive sources (null
            otherwise)
        summary:
          type: string
          nullable: true
          description: AI-generated summary of the source
        cover:
          type: string
          description: Cover image reference (empty string if none)
        folders:
          type: array
          description: Folders the source belongs to
          items:
            $ref: '#/components/schemas/KnowledgeHubFolderRef'
        created_by:
          $ref: '#/components/schemas/User'
          nullable: true
          description: User who added the source
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        processed_at:
          type: string
          format: date-time
          nullable: true
          description: When extraction finished
        content:
          type: string
          nullable: true
          description: Extracted text (only included when requested via `?include=content`)
    DeleteResult:
      type: object
      description: Returned by archive/delete endpoints.
      properties:
        id:
          type: string
          description: Identifier of the archived/deleted resource
        deleted:
          type: boolean
          description: Always true on success
    Pagination:
      type: object
      properties:
        page:
          type: integer
          description: Current page number
        page_size:
          type: integer
          description: Number of items per page
        total_count:
          type: integer
          description: Total number of items
        total_pages:
          type: integer
          description: Total number of pages
    ValidationErrorDetail:
      type: object
      properties:
        error:
          type: object
          properties:
            type:
              type: string
              description: Error category (e.g., "invalid_request")
            code:
              type: string
              description: Specific error code (e.g., "user_not_found")
            message:
              type: string
              description: Human-readable error message
  responses:
    Unauthorized:
      description: Missing or invalid API key
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationErrorDetail'
          example:
            error:
              type: authentication_error
              code: invalid_api_key
              message: Invalid or inactive API key
    Forbidden:
      description: Workspace is inactive
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationErrorDetail'
          example:
            error:
              type: authorization_error
              code: workspace_inactive
              message: Workspace is inactive
    BadRequest:
      description: Invalid request parameters
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationErrorDetail'
          example:
            error:
              type: invalid_request
              code: invalid_pagination
              message: Invalid pagination parameters
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationErrorDetail'
          example:
            error:
              type: not_found
              message: 'Scenario not found: abc123'
