        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                  description: New page title
                content:
                  type: string
                  description: New markdown body (creates a new draft)
                status:
                  type: string
                  enum:
                    - draft
                    - published
                  description: >-
                    Set to `published` to publish the new version. To archive a
                    page, use `DELETE`.
                folder_ids:
                  type: array
                  items:
                    type: string
                  description: Replace the page's folders with these UUIDs
                source_ids:
                  type: array
                  items:
                    type: string
                  description: Replace the page's attached sources with these UUIDs
                skill_ids:
                  type: array
                  items:
                    type: string
                  description: Replace the page's linked skills with these UUIDs
            example:
              title: Pricing objection guide (updated)
              content: |-
                ## Handling pricing objections

                Updated guidance…
              status: published
