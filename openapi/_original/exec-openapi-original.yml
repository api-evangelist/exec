        - Knowledge Hub - Folders
      parameters:
        - name: parent_id
          in: query
          description: >-
            Return only the direct children of this folder (folder UUID). Omit
            to list all folders.
          schema:
            type: string
        - name: query
          in: query
          description: Case-insensitive search over folder names
          schema:
            type: string
        - name: page
          in: query
          description: >-
            Pagination page number (1-indexed) — which page of results to
            return, not a Knowledge Hub page.
          schema:
            type: integer
            default: 1
            minimum: 1
        - name: page_size
          in: query
          description: Number of results per page (max 100)
          schema:
            type: integer
            default: 50
            minimum: 1
            maximum: 100
      responses:
        '200':
          description: Paginated list of folders
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/KnowledgeHubFolder'
                  pagination:
                    $ref: '#/components/schemas/Pagination'
              example:
                data:
                  - id: f1a2b3c4d5e6
                    name: Sales
                    emoji: 💼
                    parent: null
                    visibility: workspace
                    item_count: 12
                    subfolder_count: 3
                    created_at: '2026-05-01T09:00:00Z'
                    updated_at: '2026-05-10T10:00:00Z'
                pagination:
                  page: 1
                  page_size: 50
                  total_count: 8
                  total_pages: 1
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /knowledge-hub/folders/{folder_id}:
