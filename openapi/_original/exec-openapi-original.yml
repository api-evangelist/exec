openapi: 3.0.3
info:
  title: Exec API
  version: '1.0'
  description: >
    REST API for programmatic access to your Exec workspace.


    Use the Exec API to read workspace data, list members, retrieve group
    information,

    and create interactive scenario creation sessions.


    ## Authentication

    All requests require a valid API key passed in the Authorization header:

    ```

    Authorization: Bearer exec_live_...

    ```


    Create API keys in your workspace settings under **Settings > API**.
tags:
  - name: Knowledge Hub - Folders
    x-group: Knowledge Hub
  - name: Knowledge Hub - Pages
    x-group: Knowledge Hub
  - name: Knowledge Hub - Sources
    x-group: Knowledge Hub
servers:
  - url: https://api.exec.com/rest/v1
    description: Production
security:
  - bearerAuth: []
paths:
  /workspace:
    get:
      operationId: getWorkspace
      summary: Get workspace info
      description: Returns basic information about the authenticated workspace.
      tags:
        - Workspace
      responses:
        '200':
          description: Workspace information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Workspace'
              example:
                id: a1b2c3d4e5f6
                name: Acme Corp
                url_slug: acme-corp
                created_at: '2024-01-15T10:30:00Z'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /workspace/members:
    get:
      operationId: listWorkspaceMembers
      summary: List workspace members
      description: Returns a paginated list of workspace members with basic user info.
      tags:
        - Workspace
      parameters:
        - name: page
          in: query
          description: Page number (1-indexed)
          schema:
            type: integer
            default: 1
            minimum: 1
        - name: page_size
          in: query
          description: Number of results per page (max 100)
          schema:
            type: integer
            default: 50
            minimum: 1
            maximum: 100
        - name: group_ids
          in: query
          description: Comma-separated workspace group IDs to filter by
          schema:
            type: string
      responses:
        '200':
          description: List of workspace members
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/WorkspaceMember'
                  pagination:
                    $ref: '#/components/schemas/Pagination'
              example:
                data:
                  - id: m1n2o3p4q5r6
                    user:
                      id: u7v8w9x0y1z2
                      email: jane@acme.com
                      first_name: Jane
                      last_name: Smith
                    role: admin
                    created_at: '2024-01-15T10:30:00Z'
                pagination:
                  page: 1
                  page_size: 50
                  total_count: 25
                  total_pages: 1
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /workspace/groups:
    get:
      operationId: listWorkspaceGroups
      summary: List workspace groups
      description: Returns a paginated list of groups in the workspace.
      tags:
        - Workspace
      parameters:
        - name: page
          in: query
          description: Page number (1-indexed)
          schema:
            type: integer
            default: 1
            minimum: 1
        - name: page_size
          in: query
          description: Number of results per page (max 100)
          schema:
            type: integer
            default: 50
            minimum: 1
            maximum: 100
      responses:
        '200':
          description: List of workspace groups
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/WorkspaceGroup'
                  pagination:
                    $ref: '#/components/schemas/Pagination'
              example:
                data:
                  - id: g1h2i3j4k5l6
                    name: Sales Team
                    created_at: '2024-02-01T09:00:00Z'
                  - id: g7h8i9j0k1l2
                    name: Customer Success
                    created_at: '2024-02-15T14:30:00Z'
                pagination:
                  page: 1
                  page_size: 50
                  total_count: 2
                  total_pages: 1
        '401':
          $ref: '#/components/responses/Unauthorized'
  /scenarios/assignments:
    get:
      operationId: listAssignments
      summary: List scenario assignments
      description: >
        Returns a paginated list of scenario assignments in the workspace.


        Assignments represent tasks given to users to practice specific
        scenarios. Each

        assignment tracks status (not_started, in_progress, completed, past_due,
        did_not_pass),

        best score, attempt count, and completion requirements.


        Filter by user, scenario, program, or status to find specific
        assignments.
      tags:
        - Scenarios
      parameters:
        - name: user_ids
          in: query
          description: >-
            Comma-separated user IDs to filter by. When combined with
            user_emails, results are unioned (all matching users from either
            list are included).
          schema:
            type: string
        - name: user_emails
          in: query
          description: >-
            Comma-separated user email addresses to filter by. When combined
            with user_ids, results are unioned (all matching users from either
            list are included).
          schema:
            type: string
        - name: scenario_ids
          in: query
          description: Comma-separated scenario IDs to filter by
          schema:
            type: string
        - name: program_ids
          in: query
          description: Comma-separated program IDs to filter by
          schema:
            type: string
        - name: status
          in: query
          description: Filter by one or more assignment statuses
          style: form
          explode: false
          schema:
            type: array
            items:
              type: string
              enum:
                - not_started
                - in_progress
                - completed
                - past_due
                - did_not_pass
            example:
              - completed
              - past_due
        - name: page
          in: query
          description: Page number (1-indexed)
          schema:
            type: integer
            default: 1
            minimum: 1
        - name: page_size
          in: query
          description: Number of results per page (max 100)
          schema:
            type: integer
            default: 50
            minimum: 1
            maximum: 100
      responses:
        '200':
          description: Paginated list of assignments
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Assignment'
                  pagination:
                    $ref: '#/components/schemas/Pagination'
              example:
                data:
                  - id: a1b2c3d4e5f6
                    user:
                      id: u1a2b3c4d5e6
                      email: jane@acme.com
                      first_name: Jane
                      last_name: Smith
                    scenario:
                      id: s1a2b3c4d5e6
                      name: Procurement Discovery
                      slug: procurement-discovery
                    status: completed
                    due_date: '2026-04-15T00:00:00Z'
                    best_score: 88
                    best_rank: gold
                    attempt_count: 3
                    attempt_min: 1
                    attempt_max: null
                    rank_min: silver
                    program: null
                    created_at: '2026-03-01T10:00:00Z'
                pagination:
                  page: 1
                  page_size: 50
                  total_count: 1
                  total_pages: 1
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /collections:
    get:
      operationId: listCollections
      summary: List collections
      description: >
        Returns a paginated list of collections in the workspace, ordered

        alphabetically by name.


        Collections group related scenarios together (e.g. "Procurement
        Scenarios",

        "Onboarding"). Use collection IDs to filter sessions, skills, and
        scenario

        analytics by collection.
      tags:
        - Collections
      parameters:
        - name: page
          in: query
          description: Page number (1-indexed)
          schema:
            type: integer
            default: 1
            minimum: 1
        - name: page_size
          in: query
          description: Number of results per page (max 100)
          schema:
            type: integer
            default: 50
            minimum: 1
            maximum: 100
      responses:
        '200':
          description: Paginated list of collections
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Collection'
                  pagination:
                    $ref: '#/components/schemas/Pagination'
              example:
                data:
                  - id: r1a2b3c4d5e6
                    name: Procurement Scenarios
                    slug: procurement-scenarios
                    description: Practice scenarios for procurement conversations.
                    scenario_count: 4
                    created_at: '2026-01-10T09:00:00Z'
                pagination:
                  page: 1
                  page_size: 50
                  total_count: 1
                  total_pages: 1
        '401':
          $ref: '#/components/responses/Unauthorized'
  /sessions:
    get:
      operationId: listSessions
      summary: List roleplay sessions
      description: >
        Returns a paginated list of roleplay sessions in the workspace with
        inline user and scenario data.


        Sessions represent individual practice attempts on AI roleplay
        scenarios. Each session

        includes the participant's score, rank, duration, and metadata. Use
        filters to narrow

        results by user, scenario, skill, program, group, or date range.


        Note: Sessions may include users who are no longer active workspace
        members (e.g., users

        who have been removed). These users will not appear in GET
        /workspace/members but their

        historical session data is preserved.


        Results are ordered by creation date (newest first) by default.
      tags:
        - Sessions
      parameters:
        - name: user_ids
          in: query
          description: >-
            Comma-separated user IDs to filter by. When combined with
            user_emails, results are unioned (all matching users from either
            list are included).
          schema:
            type: string
            example: u1a2b3c4d5e6,u7v8w9x0y1z2
        - name: user_emails
          in: query
          description: >-
            Comma-separated user email addresses to filter by. When combined
            with user_ids, results are unioned (all matching users from either
            list are included).
          schema:
            type: string
            example: jane@acme.com,bob@acme.com
        - name: scenario_ids
          in: query
          description: Comma-separated scenario IDs to filter by
          schema:
            type: string
        - name: collection_ids
          in: query
          description: Comma-separated collection IDs to filter by
          schema:
            type: string
        - name: skill_ids
          in: query
          description: Comma-separated skill IDs to filter by
          schema:
            type: string
        - name: program_ids
          in: query
          description: Comma-separated program IDs to filter by
          schema:
            type: string
        - name: group_ids
          in: query
          description: Comma-separated workspace group IDs to filter by
          schema:
            type: string
        - name: rank
          in: query
          description: Filter by one or more performance ranks
          style: form
          explode: false
          schema:
            type: array
            items:
              type: string
              enum:
                - gold
                - silver
                - bronze
                - unranked
            example:
              - gold
              - silver
        - name: start_date
          in: query
          description: >-
            ISO 8601 datetime — only include sessions created on or after this
            date
          schema:
            type: string
            format: date-time
        - name: end_date
          in: query
          description: >-
            ISO 8601 datetime — only include sessions created on or before this
            date
          schema:
            type: string
            format: date-time
        - name: exclude_system_users
          in: query
          description: >-
            Exclude sessions from system users (emails ending in @exec.com).
            Default false.
          schema:
            type: boolean
            default: false
        - name: sorting
          in: query
          description: Sort field. Prefix with `-` for descending order.
          schema:
            type: string
            default: '-created_at'
            enum:
              - created_at
              - '-created_at'
              - score
              - '-score'
              - duration
              - '-duration'
        - name: page
          in: query
          description: Page number (1-indexed)
          schema:
            type: integer
            default: 1
            minimum: 1
        - name: page_size
          in: query
          description: Number of results per page (max 100)
          schema:
            type: integer
            default: 50
            minimum: 1
            maximum: 100
      responses:
        '200':
          description: Paginated list of roleplay sessions
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/SessionListItem'
                  pagination:
                    $ref: '#/components/schemas/Pagination'
              example:
                data:
                  - id: abc123def456
                    user:
                      id: u1a2b3c4d5e6
                      email: jane@acme.com
                      first_name: Jane
                      last_name: Smith
                    scenario:
                      id: s1a2b3c4d5e6
                      name: Procurement Discovery
                      slug: procurement-discovery
                    score: 82.5
                    rank: gold
                    duration_seconds: 347
                    is_valid_attempt: true
                    created_at: '2026-03-15T14:30:00Z'
                pagination:
                  page: 1
                  page_size: 50
                  total_count: 128
                  total_pages: 3
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /sessions/{session_id}:
    get:
      operationId: getSession
      summary: Get session detail
      description: >
        Returns full detail for a single roleplay session, including score,
        rank, duration,

        and feedback.


        Use the `include` parameter to fetch optional heavy fields like the full
        conversation

        transcript or evaluation criteria with grades. These are omitted by
        default to keep

        responses lean.
      tags:
        - Sessions
      parameters:
        - name: session_id
          in: path
          required: true
          description: The session's unique identifier (UUID)
          schema:
            type: string
        - name: include
          in: query
          description: >
            Comma-separated list of optional sections to include in the
            response.

            Available values: `transcript` (conversation lines), `evaluations`
            (rubric criteria with grades).
          schema:
            type: string
            example: transcript,evaluations
      responses:
        '200':
          description: Session detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionDetail'
              example:
                id: abc123def456
                user:
                  id: u1a2b3c4d5e6
                  email: jane@acme.com
                  first_name: Jane
                  last_name: Smith
                scenario:
                  id: s1a2b3c4d5e6
                  name: Procurement Discovery
                  slug: procurement-discovery
                score: 82.5
                rank: gold
                duration_seconds: 347
                is_valid_attempt: true
                outcome_feedback: Strong discovery questioning with good rapport building.
                positive_feedback: Excellent use of open-ended questions to uncover needs.
                constructive_feedback: Consider probing deeper into budget constraints.
                created_at: '2026-03-15T14:30:00Z'
                transcript:
                  - speaker: ai
                    text: >-
                      Hi, I'm the procurement lead at Globex. Thanks for meeting
                      with me today.
                    seconds_from_start: 0
                  - speaker: user
                    text: >-
                      Thanks for your time. I'd love to learn more about your
                      current process.
                    seconds_from_start: 4.2
                evaluations:
                  - criterion_name: Communication Skills
                    items:
                      - name: Discovery Questions
                        grade: good
                        feedback: >-
                          Asked targeted questions about pain points and current
                          workflow.
                        feedback_examples:
                          - quote: Tell me about your current procurement process.
                            feedback: Great open-ended discovery question.
                            suggestion_quote: null
                            grade: good
                            salience: high
                  - criterion_name: Objection Handling
                    items:
                      - name: Budget Concerns
                        grade: mid
                        feedback: >-
                          Addressed the budget concern but could have reframed
                          value more clearly.
                        feedback_examples: []
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /skills:
    get:
      operationId: listSkills
      summary: List skills
      description: >
        Returns a paginated list of skills in the workspace, ordered
        alphabetically by name.


        Skills represent competencies that are evaluated during roleplay
        sessions and calls

        (e.g. "Discovery Questions", "Objection Handling", "Procurement
        Selling"). Each skill

        can be linked to evaluation criteria across multiple scenarios.


        Use `?include=proficiency` to add aggregate proficiency stats per skill
        (participant

        count, scored participant count, percentage proficient+, and average
        score). This is

        computed across all workspace members who have practiced each skill.
      tags:
        - Skills
      parameters:
        - name: include
          in: query
          description: >
            Comma-separated list of optional data to include.

            Available values: `proficiency` (aggregate proficiency stats per
            skill).
          schema:
            type: string
            example: proficiency
        - name: page
          in: query
          description: Page number (1-indexed)
          schema:
            type: integer
            default: 1
            minimum: 1
        - name: page_size
          in: query
          description: Number of results per page (max 100)
          schema:
            type: integer
            default: 50
            minimum: 1
            maximum: 100
      responses:
        '200':
          description: Paginated list of skills
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Skill'
                  pagination:
                    $ref: '#/components/schemas/Pagination'
              example:
                data:
                  - id: sk1a2b3c4d5e
                    name: Procurement Selling
                    slug: procurement-selling
                    description: >-
                      Ability to identify and sell procurement solutions
                      effectively.
                    created_at: '2026-01-10T09:00:00Z'
                    proficiency_summary:
                      participant_count: 25
                      scored_participant_count: 20
                      pct_proficient_plus: 60
                      avg_score: 72.5
                  - id: sk6f7g8h9i0j
                    name: Objection Handling
                    slug: objection-handling
                    description: Skill in addressing and overcoming prospect objections.
                    created_at: '2026-01-15T14:30:00Z'
                    proficiency_summary:
                      participant_count: 18
                      scored_participant_count: 15
                      pct_proficient_plus: 40
                      avg_score: 65.3
                pagination:
                  page: 1
                  page_size: 50
                  total_count: 2
                  total_pages: 1
        '401':
          $ref: '#/components/responses/Unauthorized'
  /skills/{skill_id}/proficiency:
    get:
      operationId: getSkillProficiency
      summary: Get skill proficiency by user
      description: >
        Returns per-user proficiency data for a specific skill.


        Proficiency uses time-decay weighted scoring across all observations
        (roleplay sessions

        and calls combined). Recent observations count more than older ones
        (30-day half-life).

        A minimum of 3 observations is required before a proficiency score is
        calculated.


        Proficiency tiers: `excellent` (≥90), `proficient` (≥75), `developing`
        (≥50),

        `needs_work` (<50), `insufficient_data` (<3 observations).


        Only users with at least one observation are included in the response.
        If no user

        filters are provided, returns proficiency for all workspace members who
        have practiced

        this skill.
      tags:
        - Skills
      parameters:
        - name: skill_id
          in: path
          required: true
          description: The skill's unique identifier (UUID)
          schema:
            type: string
        - name: user_ids
          in: query
          description: >-
            Comma-separated user IDs to filter by. When combined with
            user_emails, results are unioned (all matching users from either
            list are included).
          schema:
            type: string
        - name: user_emails
          in: query
          description: >-
            Comma-separated user email addresses to filter by. When combined
            with user_ids, results are unioned (all matching users from either
            list are included).
          schema:
            type: string
            example: jane@acme.com,bob@acme.com
        - name: group_ids
          in: query
          description: Comma-separated workspace group IDs to filter by
          schema:
            type: string
        - name: end_date
          in: query
          description: Calculate proficiency as of this date (ISO 8601). Defaults to now.
          schema:
            type: string
            format: date-time
        - name: exclude_system_users
          in: query
          description: >-
            Exclude sessions from system users (emails ending in @exec.com).
            Default false.
          schema:
            type: boolean
            default: false
        - name: page
          in: query
          description: Page number (1-indexed)
          schema:
            type: integer
            default: 1
            minimum: 1
        - name: page_size
          in: query
          description: Number of results per page (max 100)
          schema:
            type: integer
            default: 50
            minimum: 1
            maximum: 100
      responses:
        '200':
          description: Per-user proficiency data for the skill
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/SkillProficiencyEntry'
                  pagination:
                    $ref: '#/components/schemas/Pagination'
              example:
                data:
                  - user:
                      id: u1a2b3c4d5e6
                      email: jane@acme.com
                      first_name: Jane
                      last_name: Smith
                    score: 82
                    tier: proficient
                    observation_count: 14
                    last_practiced_at: '2026-03-12T10:00:00Z'
                  - user:
                      id: u7v8w9x0y1z2
                      email: bob@acme.com
                      first_name: Bob
                      last_name: Jones
                    score: null
                    tier: insufficient_data
                    observation_count: 2
                    last_practiced_at: '2026-03-10T15:30:00Z'
                pagination:
                  page: 1
                  page_size: 50
                  total_count: 2
                  total_pages: 1
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /scenarios/{scenario_id}/analytics/summary:
    get:
      operationId: getScenarioAnalyticsSummary
      summary: Get scenario analytics summary
      description: >
        Returns aggregate metrics for a scenario: participant count, total
        sessions,

        average best score and rank, average lift, total practice minutes, and
        average

        session duration. Accepts both UUID and slug for the scenario
        identifier.
      tags:
        - Scenarios
      parameters:
        - name: scenario_id
          in: path
          required: true
          description: Scenario identifier (UUID or slug)
          schema:
            type: string
        - name: user_ids
          in: query
          description: >-
            Comma-separated user IDs to filter by. When combined with
            user_emails, results are unioned (all matching users from either
            list are included).
          schema:
            type: string
        - name: user_emails
          in: query
          description: >-
            Comma-separated user email addresses to filter by. When combined
            with user_ids, results are unioned (all matching users from either
            list are included).
          schema:
            type: string
        - name: group_ids
          in: query
          description: Comma-separated workspace group IDs to filter by
          schema:
            type: string
        - name: start_date
          in: query
          description: ISO 8601 datetime — only include sessions on or after this date
          schema:
            type: string
            format: date-time
        - name: end_date
          in: query
          description: ISO 8601 datetime — only include sessions on or before this date
          schema:
            type: string
            format: date-time
        - name: exclude_system_users
          in: query
          description: >-
            Exclude sessions from system users (emails ending in @exec.com).
            Default false.
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: Scenario analytics summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScenarioAnalyticsSummary'
              example:
                participant_count: 45
                total_sessions: 128
                average_best_score: 74.2
                average_best_rank: silver
                average_lift_percentage: 18.5
                total_practice_minutes: 742
                average_session_duration_seconds: 348
                score_distribution:
                  - rank: gold
                    count: 12
                    percentage: 26.7
                  - rank: silver
                    count: 18
                    percentage: 40
                  - rank: bronze
                    count: 10
                    percentage: 22.2
                  - rank: unranked
                    count: 5
                    percentage: 11.1
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /scenarios/{scenario_id}/analytics/participants:
    get:
      operationId: getScenarioAnalyticsParticipants
      summary: Get scenario participant analytics
      description: >
        Returns a per-user performance table for a scenario with pagination and
        sorting.

        Shows each participant's first score, best score, lift, rank, session
        count,

        and total practice duration.
      tags:
        - Scenarios
      parameters:
        - name: scenario_id
          in: path
          required: true
          description: Scenario identifier (UUID or slug)
          schema:
            type: string
        - name: user_ids
          in: query
          description: >-
            Comma-separated user IDs to filter by. When combined with
