generated: '2026-08-14'
method: probed
status: published
source: https://docs.exec.com/mcp
summary: >-
  Exec ships a real, anonymous, remote MCP server on its own documentation host:
  https://docs.exec.com/mcp. It answers initialize/tools/list/resources/list over
  Streamable HTTP (text/event-stream) with no credentials. It is a DOCUMENTATION
  server, not a wrapper over the Exec REST API — its three tools search and read
  docs.exec.com and file docs feedback; none of them call api.exec.com/rest/v1.
  The REST surface has no MCP server of its own, so the one-tool-per-operation
  list derived from the OpenAPI is retained separately below as candidates.
deployment:
  mode: remote
  endpoint: https://docs.exec.com/mcp
  install: null
  package: null
  auth: none
  verified: probed
  notes: >-
    Probed 2026-08-14. POST initialize returned protocolVersion 2025-11-25 and
    serverInfo {name: "Exec Docs", version: "1.0.0"} with no auth challenge.
    /.well-known/oauth-authorization-server and /.well-known/oauth-protected-resource
    both 404 on docs.exec.com — the server is genuinely anonymous, not gated.
    Hosted on Mintlify infrastructure (x-matched-path /_mintlify/mcp/[subdomain]/[transport])
    but served from Exec's own docs.exec.com host and self-identified as "Exec Docs",
    so it is Exec's published surface.
server:
  name: Exec Docs
  version: '1.0.0'
  transport: http
  protocol_version: '2025-11-25'
  url: https://docs.exec.com/mcp
  capabilities:
    tools:
      listChanged: true
    resources:
      listChanged: true
  instructions_excerpt: >-
    "This Model Context Protocol server provides search and retrieval tools for
    the Exec Docs site... Apart from the submit_feedback tool, the server is
    read-only and scoped to Exec Docs."
tools:
- name: search_exec_docs
  title: Search documentation
  description: >-
    Search across the Exec Docs knowledge base to find relevant information, code
    examples, API references, and guides.
  input_schema:
    type: object
    required: [query]
    properties:
      query: {type: string, description: Search query}
  annotations: {readOnlyHint: true, destructiveHint: false, idempotentHint: true, openWorldHint: false}
- name: query_docs_filesystem_exec_docs
  description: >-
    Run a read-only shell-like query (rg/grep/find/tree/ls/cat/head/tail/jq/...)
    against a virtualized in-memory filesystem containing only the Exec Docs
    pages and OpenAPI specs. Stateless per call; output truncated to 30KB.
  input_schema:
    type: object
    required: [command]
    properties:
      command: {type: string, description: A shell command to run against the virtualized documentation filesystem}
  annotations: {readOnlyHint: true, destructiveHint: false, idempotentHint: true, openWorldHint: false}
- name: submit_feedback
  title: Submit documentation feedback
  description: Report a problem with a documentation page so the docs team can fix it.
  input_schema:
    type: object
    required: [path, feedback]
    properties:
      path: {type: string, minLength: 1, description: The documentation page path the feedback is about}
      feedback: {type: string, minLength: 1, description: A clear description of the documentation issue or suggestion}
  annotations: {readOnlyHint: false}
resources:
- uri: mintlify://skills/exec
  name: exec
  mime_type: text/markdown
  description: >-
    Provider-published Agent Skill playbook for Exec (name/description
    frontmatter + product summary, API quick reference, decision guidance,
    gotchas, verification checklist). Saved verbatim to
    skills/exec-provider-skill.md.
