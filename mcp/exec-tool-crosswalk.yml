notes: >-
  Not a gap to paper over: Exec's docs MCP server is a genuine agent surface and
  the REST API is a genuine developer surface, but they are disjoint. The
  provider-published Agent Skill (skills/exec-provider-skill.md, served as the
  mintlify://skills/exec resource on the same server) is what bridges them today —
  it teaches an agent the REST endpoints in prose rather than exposing them as
  callable tools.
