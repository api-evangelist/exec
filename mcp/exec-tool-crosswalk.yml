method: derived
source: mcp/exec-mcp.yml + openapi/_original/exec-openapi-original.yml
summary: >-
  Exec's MCP surface and its REST surface do not overlap at all. The live MCP
  server (https://docs.exec.com/mcp) is a documentation server — search, read and
  feedback over docs.exec.com content — while the OpenAPI describes the workspace
  REST API at https://api.exec.com/rest/v1. No MCP tool is backed by a REST
  operation, and no REST operation has an MCP tool. Recording that divergence
  honestly is the point of this file: an agent that connects to Exec's MCP server
  can read the docs but cannot list a session, assign a scenario, or create a
  Knowledge Hub page.
surfaces:
  openapi:
    file: openapi/_original/exec-openapi-original.yml
    base_url: https://api.exec.com/rest/v1
    auth: bearer API key (exec_live_)
    gated: true
    note: Operations require a workspace API key; the spec itself is public.
  mcp:
    url: https://docs.exec.com/mcp
    gated: false
    note: tools/list and resources/list answered anonymously on 2026-08-14.
  graphql:
    endpoint: null
    note: No GraphQL surface. https://api.exec.com/graphql returned 404.
crosswalk: []
mcp_only:
- tool: search_exec_docs
  reason: >-
    Documentation search over docs.exec.com. No REST operation exposes docs
    content — the Knowledge Hub operations manage a customer's own workspace
    content, not Exec's product documentation.
- tool: query_docs_filesystem_exec_docs
  reason: >-
    Read-only virtualized filesystem over the docs corpus and its OpenAPI files.
    A docs-platform capability with no API-side equivalent.
- tool: submit_feedback
  reason: >-
    Files documentation feedback to Exec's docs team. The only non-read-only tool
    on the server, and it has no public REST operation.
