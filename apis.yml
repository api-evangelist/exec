image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/icons/exec.png
name: Exec
description: >-
  Exec is an AI-powered roleplay and sales-training platform (exec.com) for
  practicing high-stakes conversations. Teams run voice-based AI roleplays,
  automatically score real calls, build structured programs and certifications,
  coach one-on-one, and manage training content in a Knowledge Hub. The Exec REST
  API gives programmatic access to a workspace: members and groups, scenarios and
  collections, roleplay sessions and analytics, skills and proficiency, Scenario
  Studio job creation, and Knowledge Hub pages and sources. Backed by a16z.
